</style></head><body><div id="app"></div><div id="toast" role="status" hidden></div><dialog id="zoom"></dialog><article id="printReport"></article><script>'use strict';
const $=id=>document.getElementById(id), KEY='proportion_lab_bilingual_v2';
const DEFAULT=()=>({version:2,lang:'th',page:'basics',student:{name:'',room:'',no:''},ratio:{a:2,b:3,f:2},lab:{mode:'direct',x:3,k:8,c:20,locked:true},missions:Array.from({length:6},()=>({prediction:'',first:null,stage:0,observed:null,reason:'',done:false,attempts:0})),mission:0,quiz:[],set:'',started:'',archives:[]});
let state=DEFAULT(),storageOK=true,timer=null,toastTimer=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===2&&Array.isArray(saved.missions)&&saved.missions.length===6&&Array.isArray(saved.quiz))state={...state,...saved}}catch(e){storageOK=false}
const T=(th,en)=>state.lang==='th'?th:en,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number.isFinite(n)?Number(n.toFixed(2)).toLocaleString(state.lang==='th'?'th-TH':'en-US'):'—';
const now=()=>new Date().toISOString(),date=v=>new Date(v).toLocaleString(state.lang==='th'?'th-TH':'en-GB',{timeZone:'Asia/Bangkok'}),pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}const el=$('saveStatus');if(el)el.textContent=storageOK?T('บันทึกความคืบหน้าในเบราว์เซอร์นี้อัตโนมัติ','Progress saved automatically in this browser'):T('บันทึกในเครื่องไม่ได้ กรุณาส่งออก PDF ก่อนปิดหน้า','Local saving is unavailable. Export a PDF before closing.')}
function toast(th,en){$('toast').textContent=T(th,en);$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3600)}
function stop(){clearInterval(timer);timer=null;const b=$('play');if(b){b.textContent=T('▶ ทดลองอัตโนมัติ','▶ Auto experiment');b.setAttribute('aria-pressed','false')}}
function go(page){stop();state.page=page;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function setLang(lang){stop();state.lang=lang;persist();render()}
function studentField(key,value){state.student[key]=value;persist()}
function newStudent(){if(!confirm(T('เริ่มผู้เรียนใหม่จะล้างข้อมูลผู้เรียนและความคืบหน้าในเครื่องนี้ กรุณาส่งออก PDF ก่อน ต้องการดำเนินการต่อหรือไม่?','Starting a new learner clears the current profile and progress in this browser. Export a PDF first. Continue?')))return;stop();const lang=state.lang;state=DEFAULT();state.lang=lang;createQuiz();persist();render()}
const tabs=[['basics','อัตราส่วนและสัดส่วน','Ratio & proportion'],['lab','ห้องทดลอง','Explore'],['missions','6 ภารกิจทีละขั้น','6 guided missions'],['quiz','แบบฝึกหัด 10 ข้อ','10-question practice'],['report','รายงานผล','My report']];
function render(){document.documentElement.lang=state.lang;document.title=T('Proportion Lab • สัดส่วน ม.1','Proportion Lab • Grade 7');$('app').innerHTML=`<main class="wrap"><header><div><div class="eyebrow">PROPORTION LAB · ${T('คณิตศาสตร์ ม.1','GRADE 7 MATHEMATICS')}</div><h1>${T('ห้องทดลองสัดส่วน','Explore proportions')}</h1></div><div class="actions"><button aria-pressed="${state.lang==='th'}" class="${state.lang==='th'?'active':''}" onclick="setLang('th')">ไทย</button><button aria-pressed="${state.lang==='en'}" class="${state.lang==='en'?'active':''}" onclick="setLang('en')">English</button></div></header><section class="profile"><div class="profileFields"><label>${T('ชื่อ–นามสกุล','Full name')}<input id="studentName" maxlength="100" value="${esc(state.student.name)}" oninput="studentField('name',this.value)" autocomplete="name"></label><label>${T('ชั้น / ห้อง','Class / room')}<input maxlength="35" value="${esc(state.student.room)}" oninput="studentField('room',this.value)"></label><label>${T('เลขที่','Student no.')}<input maxlength="15" value="${esc(state.student.no)}" oninput="studentField('no',this.value)"></label></div><button onclick="newStudent()">${T('เริ่มผู้เรียนใหม่','New learner')}</button><p id="saveStatus" class="muted"></p></section><nav class="tabs" aria-label="${T('บทเรียน','Learning sections')}">${tabs.map(([id,th,en],i)=>`<button class="${state.page===id?'active':''}" aria-pressed="${state.page===id}" onclick="go('${id}')">${i+1}. ${T(th,en)}</button>`).join('')}</nav><div id="content"></div><footer>${T('ไฟล์เดียว ใช้งานออฟไลน์ได้ • ข้อมูลอยู่ในเบราว์เซอร์เครื่องนี้ ไม่มีการส่งคะแนนให้ครูอัตโนมัติ','Single-file offline app • Data stays in this browser. Results are not sent to a teacher automatically.')}<br>${T('ผลรายงานใช้เวลาไทย (UTC+7) • ตัวเลขปัดแสดงไม่เกิน 2 ตำแหน่ง โดยคำนวณจากค่าจริง','Reports use Thailand time (UTC+7) • Display values are rounded to 2 decimals; calculations use unrounded values.')}</footer></main>`;if(state.page==='basics')renderBasics();if(state.page==='lab')renderLab();if(state.page==='missions')renderMissions();if(state.page==='quiz')renderQuiz();if(state.page==='report')renderReport();persist()}
function control(id,label,value,min,max,step,handler){return `<div class="control"><div class="labelrow"><label for="${id}">${label}</label><input class="number" type="number" id="${id}Num" aria-label="${label} ${T('พิมพ์ค่า','numeric input')}" min="${min}" max="${max}" step="${step}" value="${value}" onchange="${handler}(this.value,true)"></div><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" oninput="${handler}(this.value,false)"><div class="ends"><span>${min}</span><span>${max}</span></div></div>`}
function validInput(raw,min,max,step){const n=Number(raw);return String(raw).trim()!==''&&Number.isFinite(n)&&n>=min&&n<=max&&Math.abs((n-min)/step-Math.round((n-min)/step))<1e-8}
function ratioChange(key,raw){if(!validInput(raw,1,key==='f'?5:6,1)){toast('กรุณาใส่จำนวนเต็มในช่วงที่กำหนด','Enter a whole number within the displayed range');renderBasics();return}state.ratio[key]=+raw;persist();updateRatio()}
function renderBasics(){let r=state.ratio;$('content').innerHTML=`<section class="panel"><div class="eyebrow">01 / ${T('ปูพื้นฐาน','FOUNDATIONS')}</div><h2>${T('จากอัตราส่วน สู่สัดส่วน','From ratios to proportions')}</h2><div class="three"><div class="note"><h3>${T('1. อัตราส่วน','1. Ratio')}</h3><p>${T('เปรียบเทียบปริมาณสองปริมาณตามลำดับ เช่น น้ำหวาน : น้ำ = 2 : 3 ลำดับของปริมาณมีความสำคัญ','Compare two quantities in a specified order. For example, syrup : water = 2 : 3. The order matters.')}</p></div><div class="note"><h3>${T('2. อัตราส่วนที่เท่ากัน','2. Equivalent ratios')}</h3><p>${T('คูณหรือหารทั้งสองจำนวนด้วยจำนวนเดียวกันที่ไม่เป็นศูนย์ เช่น 2 : 3 = 4 : 6','Multiply or divide both quantities by the same nonzero number: 2 : 3 = 4 : 6.')}</p></div><div class="note"><h3>${T('3. สัดส่วน','3. Proportion')}</h3><p>${T('ประโยคที่แสดงว่าอัตราส่วนสองอัตราส่วนเท่ากัน เช่น 2/3 = 4/6','An equation stating that two ratios are equal, such as 2/3 = 4/6.')}</p></div></div><div class="grid"><div>${control('ra',T('น้ำหวาน a (ถ้วย)','Syrup a (cups)'),r.a,1,6,1,"changeRA")}${control('rb',T('น้ำ b (ถ้วย)','Water b (cups)'),r.b,1,6,1,"changeRB")}${control('rf',T('ตัวคูณร่วม m','Common multiplier m'),r.f,1,5,1,"changeRF")}</div><div><div id="ratioVisual"></div><div id="ratioEquation" class="formula"></div><div class="note">${T('คูณทั้งสองปริมาณด้วยจำนวนเดียวกัน ความเข้มข้นของส่วนผสมจึงเท่าเดิม แต่ปริมาณรวมเพิ่มขึ้น','Multiplying both quantities by the same factor preserves the mixture ratio, while the total amount increases.')}</div><div class="note warning">${T('2 : 3 ไม่เท่ากับ 3 : 4 การบวกจำนวนเดียวกันทั้งสองด้านไม่ได้รักษาอัตราส่วนเสมอไป','2 : 3 is not equal to 3 : 4. Adding the same amount to both quantities does not generally preserve a ratio.')}</div></div></div><div class="formula">a/b = c/d ⇔ ad = bc &nbsp; (b ≠ 0, d ≠ 0)</div><p>${T('ก่อนคูณไขว้ ต้องจัดลำดับปริมาณและหน่วยให้ตรงกัน หากเปรียบเทียบปริมาณชนิดเดียวกันที่ใช้หน่วยต่างกัน ให้แปลงเป็นหน่วยเดียวกันก่อน เช่น 1 เมตร : 50 เซนติเมตร = 100 : 50 = 2 : 1','Before cross-multiplying, keep quantities and units in a consistent order. When comparing the same kind of quantity in different units, convert first: 1 metre : 50 centimetres = 100 : 50 = 2 : 1.')}</p><button class="primary" onclick="go('lab')">${T('ไปทดลองความสัมพันธ์ →','Explore the relationships →')}</button></section>`;updateRatio()}
function changeRA(v){ratioChange('a',v)}function changeRB(v){ratioChange('b',v)}function changeRF(v){ratioChange('f',v)}
function updateRatio(){let {a,b,f}=state.ratio;for(const [id,v] of [['ra',a],['rb',b],['rf',f]]){$(id).value=v;$(id+'Num').value=v}const strip=(x,y)=>`<div class="mix"><span style="flex:${x};background:#b3a0ff">${x}</span><span style="flex:${y};background:#55e1d2;color:#082c2c">${y}</span></div>`;$('ratioVisual').innerHTML=`<h3>${T('สีม่วง = น้ำหวาน · สีเขียว = น้ำ','Purple = syrup · Green = water')}</h3><p>${T('สูตรเดิม','Original recipe')}: ${a} : ${b}</p>${strip(a,b)}<p>${T('ขยายสูตร','Scaled recipe')}: ${a*f} : ${b*f}</p>${strip(a*f,b*f)}<p class="muted">${T('ความยาวแถบเท่ากันเพื่อเปรียบเทียบสัดส่วนสี ไม่ได้แสดงปริมาตรรวม','Equal-length bars compare fractions of the mixture, not total volume.')}</p>`;$('ratioEquation').textContent=`${a} : ${b} = (${a} × ${f}) : (${b} × ${f}) = ${a*f} : ${b*f}`}
function labValue(mode,x,k,c=0){return mode==='inverse'?k/x:k*x+(mode==='non'?c:0)}
function labMax(l){return l.locked?(l.mode==='inverse'?60:l.mode==='non'?280:240):(l.mode==='inverse'?l.k:l.k*12+(l.mode==='non'?l.c:0))}
function labMode(mode){stop();state.lab={...state.lab,mode,x:mode==='inverse'?4:3,k:mode==='inverse'?24:8,c:20};persist();renderLab()}
function setLab(key,raw){stop();let l=state.lab,[min,max,step]=key==='x'?[1,12,1]:key==='c'?[10,40,5]:l.mode==='inverse'?[12,60,12]:[2,20,1];if(!validInput(raw,min,max,step)){toast('กรุณาใส่ค่าตามช่วงและขั้นที่กำหนด','Enter a value within the range and step');updateLab();return}l[key]=+raw;persist();updateLab()}
function changeX(v){setLab('x',v)}function changeK(v){setLab('k',v)}function changeC(v){setLab('c',v)}
function resetLab(){let lock=state.lab.locked;labMode(state.lab.mode);state.lab.locked=lock;updateLab()}
function setLock(checked){state.lab.locked=checked;persist();updateLab()}
function toggleAuto(){if(timer){stop();return}$('play').textContent=T('Ⅱ หยุดทดลอง','Ⅱ Pause');$('play').setAttribute('aria-pressed','true');timer=setInterval(()=>{state.lab.x=state.lab.x>=12?1:state.lab.x+1;updateLab();persist()},900)}

on in 24 days or 6 people in 4 days, under the assumptions above.'):T('เมื่อทดลองผลของจำนวนดินสอ ให้ตรึงราคาต่อแท่งไว้ก่อน แล้วจึงทดลองเปลี่ยนราคา','To study quantity, keep the unit price fixed first. Then investigate a different unit price.')}</div></section><section class="panel"><div id="stats" class="stats"></div><div id="scene" class="scene"></div><div class="actions graphTools"><label class="checkLabel"><input type="checkbox" id="lock" ${l.locked?'checked':''} onchange="setLock(this.checked)">${T('ตรึงสเกลแกนตั้ง','Fix vertical scale')}</label><button onclick="zoomGraph()">${T('ขยายกราฟ','Enlarge graph')}</button></div><p id="scaleNote" class="muted"></p><div class="chartScroll"><svg id="chart" class="chart" viewBox="0 0 650 330" role="img"></svg></div><p class="legend">${T('จุดสีเขียว = ค่าที่เลือก · จุดโปร่ง = จำนวนเต็มอื่น ๆ · เลื่อนกราฟแนวนอนได้บนจอเล็ก','Green dot = selected value · Open dots = other whole-number values · Swipe horizontally on small screens.')}</p><div class="note">${T('จำนวนดินสอและจำนวนคนในกิจกรรมนี้เป็นจำนวนเต็ม เส้นต่อเนื่องแสดงแบบจำลองทางคณิตศาสตร์ ไม่ได้หมายความว่าซื้อดินสอหรือใช้คนเป็นเศษส่วนได้','Pencil and worker counts in this activity are whole numbers. The continuous line shows the mathematical model, not fractional pencils or workers.')}</div></section></div><div class="lower"><section class="panel"><h2>${T('ตารางตรวจสอบความสัมพันธ์','Check the relationship')}</h2><div id="table"></div><p class="small">${T('ค่าที่แสดงอาจปัดเศษ แต่ตรวจค่าคงที่จากค่าจริงก่อนปัด','Displayed values may be rounded; constants are calculated before rounding.')}</p></section><section class="panel"><h2>${T('สิ่งที่ควรสังเกต','What to notice')}</h2><div id="observation"></div><div id="equation" class="formula"></div><div class="note warning">${T('เพิ่มพร้อมกันไม่ได้แปลว่าเป็นสัดส่วนตรงเสมอ และเปลี่ยนสวนทางกันไม่ได้แปลว่าเป็นสัดส่วนผกผันเสมอ ต้องตรวจค่าคงที่ด้วย','Increasing together does not always mean direct proportion. Moving in opposite directions function updateLab(){let l=state.lab,{mode,x,k,c}=l,inv=mode==='inverse',non=mode==='non',y=labValue(mode,x,k,c);for(let key of ['x','k','c'])if($(key)){$(key).value=l[key];$(key+'Num').value=l[key]}$('formula').innerHTML=`${inv?'y = k/x':non?'y = kx + c':'y = kx'}<br><strong>${fmt(y)} ${Number.isInteger(y)?'=':'≈'} ${inv?`${k} ÷ ${x}`:non?`${k} × ${x} + ${c}`:`${k} × ${x}`}</strong>`;let unit=inv?T('วัน','days'):T('บาท','THB');$('stats').innerHTML=`<div class="stat"><span>${inv?T('เวลาทำงาน y','Time y'):T('ค่าใช้จ่ายรวม y','Total cost y')}</span><b>${fmt(y)} <small>${unit}</small></b></div><div class="stat"><span>${non?T('y/x ไม่คงที่','y/x is not constant'):inv?'xy = k':'y/x = k'}</span><b>${fmt(non?y/x:k)}</b><span>${inv?T('คน·วัน','person-days'):T('บาท/แท่ง','THB/item')}</span></div>`;$('scene').innerHTML=Array.from({length:x},(_,i)=>`<div class="unit"><span aria-hidden="true">${inv?'👷':'✏️'}</span><small>${i+1}</small></div>`).join('');$('scene').setAttribute('aria-label',`${x} ${inv?T('คน','workers'):T('แท่ง','pencils')}`);$('scaleNote').textContent=l.locked?T('ตรึงช่วงแกนตั้งไว้: เปลี่ยน k แล้วเปรียบเทียบกราฟได้โดยตรง','Fixed vertical range: change k to compare the graphs directly'):T('แกนตั้งปรับตามข้อมูล: รูปร่างกราฟอาจดูเหมือนเดิมเมื่อเปลี่ยน k','Automatic vertical range: the curve may look unchanged when k changes');const vals=[...new Set([1,2,3,4,6,8,12,x])].sort((a,b)=>a-b);$('table').innerHTML=`<table><thead><tr><th>x (${inv?T('คน','people'):T('แท่ง','items')})</th><th>y (${unit})</th><th>${inv?'xy': 'y/x'} (${inv?T('คน·วัน','person-days'):T('บาท/แท่ง','THB/item')})</th></tr></thead><tbody>${vals.map(t=>{let val=labValue(mode,t,k,c);return `<tr class="${t===x?'current':''}"><td>${t}</td><td>${fmt(val)}</td><td>${fmt(inv?k:val/t)}</td></tr>`}).join('')}</tbody></table>`;$('observation').innerHTML=non?`<p>${T('เมื่อจำนวนเพิ่มเป็น 2 เท่า ค่าใช้จ่ายไม่ได้เพิ่มเป็น 2 เท่า เพราะค่าจัดส่งถูกคิดเพียงครั้งเดียว','Doubling the quantity does not double the total cost, because the delivery fee is charged only once.')}</p><p>${T('กราฟแบบจำลองตัดแกนตั้งที่ c ไม่ผ่านจุดกำเนิด กิจกรรมนี้คิดเฉพาะคำสั่งซื้อที่มีอย่างน้อย 1 แท่ง ส่วน x = 0 เป็นการต่อเส้นแบบจำลอง','The model crosses the vertical axis at c, not the origin. Orders here contain at least 1 pencil; x = 0 is a mathematical extension.')}</p>`:inv?`<p>${T('เพิ่มคนเป็น 2 เท่า เวลาลดเหลือครึ่งหนึ่ง เมื่อปริมาณงานคงที่ ผลคูณ xy คงที่','Doubling workers halves the time when workload is fixed. The product xy stays constant.')}</p><p>x &gt; 0; ${T('ไม่สามารถใช้คน 0 คนทำงานให้เสร็จได้','zero workers cannot complete the task.')}</p>`:`<p>${T('เพิ่มจำนวนเป็น 2 เท่า ราคารวมเพิ่มเป็น 2 เท่า เมื่อราคาต่อแท่งคงที่ อัตราส่วน y/x คงที่','Doubling the quantity doubles the price when unit price is fixed. The ratio y/x stays constant.')}</p><p>${T('กราฟแบบจำลองเป็นเส้นตรงผ่านจุดกำเนิด','The model is a straight line through the origin.')}</p>`;$('equation').textContent=non?`y/x = k + c/x = ${k} + ${c}/${x}`:inv?`1/${x} = y/${k} → ${x}y = ${k} → y ${Number.isInteger(y)?'=':'≈'} ${fmt(y)}`:`1/${x} = ${k}/y → y = ${x} × ${k} = ${fmt(y)}`;$('chart').innerHTML=graphSVG(l);$('chart').setAttribute('aria-label',T(`กราฟเมื่อ x = ${x}, y = ${fmt(y)}, k = ${k}`,`Graph at x = ${x}, y = ${fmt(y)}, k = ${k}`))}
function graphSVG(l){const {mode,x,k,c}=l,inv=mode==='inverse',max=labMax(l),X=t=>62+t/12*556,Y=v=>276-v/max*230,y=labValue(mode,x,k,c);let s='';for(let i=0;i<=4;i++){let v=max*i/4,py=Y(v);s+=`<line x1="62" y1="${py}" x2="618" y2="${py}" stroke="#293850"/><text x="53" y="${py+5}" text-anchor="end">${fmt(v)}</text>`}for(let i=0;i<=12;i+=2)s+=`<text x="${X(i)}" y="298" text-anchor="middle">${i}</text>`;s+='<path d="M62 36V276H624" stroke="#a7b6cc" fill="none"/>';s+=`<text x="62" y="22">y · ${inv?T('เวลา (วัน)','Time (days)'):T('ค่าใช้จ่าย (บาท)','Cost (THB)')}</text><text x="618" y="322" text-anchor="end">x · ${inv?T('จำนวนคน','Workers'):T('จำนวนดินสอ','Pencils')}</text>`;let p='';for(let t=inv?1:0;t<=12.001;t+=.05)p+=(p?'L':'M')+X(t).toFixed(2)+','+Y(labValue(mode,t,k,c)).toFixed(2);s+=`<path d="${p}" fill="none" stroke="#55e1d2" stroke-width="3"/>`;for(let t=1;t<=12;t++)s+=`<circle cx="${X(t)}" cy="${Y(labValue(mode,t,k,c))}" r="3" fill="#121c30" stroke="#55e1d2"/>`;s+=`<path d="M62 ${Y(y)}H${X(x)}V276" fill="none" stroke="#b3a0ff" stroke-dasharray="5 5"/><circle cx="${X(x)}" cy="${Y(y)}" r="7" fill="#55e1d2" stroke="white" stroke-width="2"/><text x="${x>8?X(x)-12:X(x)+12}" y="${Y(y)<65?Y(y)+27:Y(y)-14}" text-anchor="${x>8?'end':'start'}">(${x}, ${fmt(y)})</text>`;return s}
function zoomGraph(){stop();$('zoom').innerHTML=`<div class="labelrow"><h2>${T('กราฟขยาย','Expanded graph')}</h2><button onclick="document.getElementById('zoom').close()">${T('ปิด','Close')} ✕</button></div><div class="chartScroll"><svg class="chart" viewBox="0 0 650 330" role="img" aria-label="${T('กราฟขยาย','Expanded graph')}">${graphSVG(state.lab)}</svg></div><p>${T('เลื่อนแนวนอนเพื่ออ่านกราฟบนจอเล็ก','Scroll horizontally to inspect the graph on small screens.')}</p>`;$('zoom').showModal()}

const tr=pair=>T(pair[0],pair[1]);function selectMission(i){if(i>0&&!state.missions[i-1].done)return;state.mission=i;persist();renderMissions()}
function renderMissions(){let i=state.mission,m=missionData[i],s=state.missions[i],passed=state.missions.filter(x=>x.done).length;$('content').innerHTML=`<section class="panel"><h2>${T('ทำนาย → ทดลอง → อธิบาย','Predict → observe → explain')}</h2><p class="muted">${T('ทำภารกิจตามลำดับ บันทึกคำทำนายก่อนเปิดผลทดลอง แล้วเลือกเหตุผลเพื่อผ่านภารกิจ คำทำนายครั้งแรกเก็บไว้ให้ทบทวน แม้ทำนายผิดก็เรียนรู้ต่อได้','Complete missions in order. Record a prediction before revealing the observation, then choose the reasoning to pass. Your first prediction is kept for reflection; an incorrect prediction does not block learning.')}</p><div class="progress"><div style="width:${passed/6*100}%"></div></div><div class="tabs">${missionData.map((q,j)=>`<button ${j>0&&!state.missions[j-1].done?'disabled':''} class="${j===i?'active':''}" onclick="selectMission(${j})">${state.missions[j].done?'✓ ':''}${j+1}. ${tr(q.title)}</button>`).join('')}</div><h2>${i+1}. ${tr(m.title)}</h2><div class="missionSteps"><div class="note"><h3>1. ${T('ทำนายก่อนทดลอง','Predict first')}</h3><p>${tr(m.prompt)}</p><div class="actions"><input aria-label="${T('คำทำนาย','Prediction')}" id="prediction" class="answer" inputmode="decimal" value="${esc(s.prediction)}" ${s.stage>0?'disabled':''} oninput="state.missions[${i}].prediction=this.value;persist()"><span>${tr(m.unit)}</span><button class="primary" ${s.stage>0?'disabled':''} onclick="recordPrediction()">${T('บันทึกคำทำนาย','Record prediction')}</button></div></div><div class="note"><h3>2. ${T('ทดลองและบันทึกผล','Observe and record')}</h3><button ${s.stage!==1?'disabled':''} onclick="observeMission()">${T('ทดลองตามเงื่อนไขและบันทึกผล','Run the specified experiment & record')}</button>${s.observed?`<div class="formula">${tr(m.observation)}</div>${m.lab?`<div class="chartScroll"><svg class="chart" viewBox="0 0 650 330" role="img" aria-label="${T('กราฟผลการทดลอง','Observed graph')}">${graphSVG(m.lab)}</svg></div>`:''}<p class="muted">${T('บันทึกเมื่อ','Recorded')}: ${date(s.observed.time)}</p>`:''}</div><div class="note"><h3>3. ${T('อธิบายผล','Explain the result')}</h3>${s.stage>=2?`<p>${T('เหตุผลใดอธิบายผลได้ถูกต้อง?','Which explanation matches the observation?')}</p>${m.reason.map((pair,j)=>`<label class="choice"><input type="radio" name="reason" ${String(j)===s.reason?'checked':''} ${s.done?'disabled':''} onchange="state.missions[${i}].reason='${j}';persist()">${tr(pair)}</label>`).join('')}<button class="primary" ${s.done?'disabled':''} onclick="checkMission()">${T('ตรวจเหตุผล','Check reasoning')}</button><div id="missionFeedback" aria-live="polite">${s.done?`<p class="good">✓ ${tr(m.explain)}</p>`:''}</div>`:`<p class="muted">${T('บันทึกผลทดลองก่อนทำขั้นนี้','Record the observation to unlock this step.')}</p>`}</div></div>${s.done?`<button class="primary" onclick="${i<5?`selectMission(${i+1})`:`go('quiz')`}">${i<5?T('ภารกิจถัดไป →','Next mission →'):T('ไปทำแบบฝึกหัด →','Start practice →')}</button>`:''}</section>`}
function parseNumber(raw){const x=String(raw).trim();return /^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(x)&&Number.isFinite(Number(x))?Number(x):null}
function recordPrediction(){let s=state.missions[state.mission],value=parseNumber(s.prediction);if(value===null){toast('กรุณาใส่คำทำนายเป็นตัวเลข','Please enter a numeric prediction');return}if(s.stage)return;s.first={value,correct:Math.abs(value-missionData[state.mission].answer)<1e-9,time:now()};s.stage=1;persist();renderMissions()}
function observeMission(){let i=state.mission,s=state.missions[i];if(s.stage!==1)return;s.observed={value:missionData[i].answer,time:now()};s.stage=2;persist();renderMissions()}
function checkMission(){let i=state.mission,s=state.missions[i],m=missionData[i];if(s.done||s.stage<2)return;if(s.reason===''){toast('กรุณาเลือกเหตุผล','Please choose an explanation');return}s.attempts++;s.done=+s.reason===m.right;if(s.done){s.stage=3;s.completed=now();persist();renderMissions()}else{persist();$('missionFeedback').innerHTML=`<p class="bad">${T('ลองตรวจอัตราส่วนหรือผลคูณจากผลทดลอง แล้วเลือกใหม่','Check the ratio or product in the observation, then try again.')}</p>`}}
function makeQ(topic,prompt,answer,unit,hint,reason,choices=null){return {topic,prompt,answer,unit,hint,reason,choices,draft:'',first:null,last:null,attempts:0,hintShown:false}}
function generateQuiz(){const a=rand(1,4),b=rand(5,8),f=rand(2,5),k=rand(3,12),x=rand(3,10),price=rand(4,15),items=rand(3,8),workers=rand(2,4),days=2*rand(3,8),work=pick([24,36,48,60]),time=pick([2,3,4,6]),u=rand(1,4),v=rand(5,9),factor=rand(2,5),shipping=5*rand(2,6),copies=rand(2,8),cost=rand(4,12),kind=pick(['direct','inverse','non']),pair=pick([[2,3],[3,4],[3,5],[4,5]]),mult=rand(2,5),cm=pick([10,20,25,50]);const models={direct:[['ค่าโดยสารคนละ 15 บาท ไม่มีค่าบริการอื่น จำนวนคนกับค่าโดยสารรวมสัมพันธ์แบบใด?','Tickets cost 15 THB per person with no other fees. How are people and total cost related?'],['y = 15x จึงมี y/x = 15 คงที่','y = 15x, so y/x = 15 is constant.']],inverse:[['ระยะทางเท่าเดิม หากเดินทางด้วยอัตราเร็วคงที่ต่างกัน อัตราเร็วกับเวลาเดินทางสัมพันธ์แบบใด?','For a fixed distance travelled at different constant speeds, how are speed and travel time related?'],['อัตราเร็ว × เวลา = ระยะทางคงที่ จึงเป็นสัดส่วนผกผัน','Speed × time = fixed distance, so the relationship is inverse proportion.']],non:[['ค่าพิมพ์แผ่นละ 2 บาท บวกค่าเตรียมงาน 30 บาท จำนวนแผ่นกับค่าใช้จ่ายรวมสัมพันธ์แบบใด?','Printing costs 2 THB per page plus a 30 THB setup fee. How are page count and total cost related?'],['y = 2x + 30 ทั้ง y/x และ xy ไม่คงที่','y = 2x + 30; neither y/x nor xy is constant.']]};return [
makeQ(['อัตราส่วนที่เท่ากัน','Equivalent ratios'],[`น้ำหวาน : น้ำ = ${a} : ${b} ถ้าใช้น้ำหวาน ${a*f} ถ้วย ต้องใช้น้ำกี่ถ้วย?`,`Syrup : water = ${a} : ${b}. With ${a*f} cups of syrup, how many cups of water are needed?`],b*f,['ถ้วย','cups'],['หาตัวคูณที่ใช้กับน้ำหวาน แล้วใช้กับน้ำด้วย','Find the syrup multiplier, then apply it to water.'],[`${a*f}/${a} = ${f} จึงใช้น้ำ ${b} × ${f} = ${b*f} ถ้วย`,`${a*f}/${a} = ${f}, so water = ${b} × ${f} = ${b*f} cups.`]),
makeQ(['ย่ออัตราส่วน','Simplify a ratio'],[`อัตราส่วน ${pair[0]*mult} : ${pair[1]*mult} เท่ากับ ${pair[0]} : x แล้ว x เท่ากับเท่าใด?`,`The ratio ${pair[0]*mult} : ${pair[1]*mult} equals ${pair[0]} : x. Find x.`],pair[1],['',''],['หารทั้งสองจำนวนด้วยจำนวนเดียวกัน','Divide both numbers by the same value.'],[`หารทั้งสองจำนวนด้วย ${mult} ได้ ${pair[0]} : ${pair[1]}`,`Divide both numbers by ${mult} to get ${pair[0]} : ${pair[1]}.`]),
makeQ(['สัดส่วนตรง','Direct proportion'],[`สมุดเล่มละ ${k} บาท ซื้อ ${x} เล่ม ต้องจ่ายกี่บาท เมื่อไม่มีส่วนลด?`,`Notebooks cost ${k} THB each. How much do ${x} notebooks cost, with no discount?`],k*x,['บาท','THB'],['ราคารวม = ราคาต่อเล่ม × จำนวนเล่ม','Total = unit price × quantity.'],[`y = ${k} × ${x} = ${k*x} บาท`,`y = ${k} × ${x} = ${k*x} THB.`]),
makeQ(['หาค่าคงที่','Find the constant'],[`ผลไม้ ${items} กิโลกรัม ราคา ${items*price} บาท ถ้าราคาต่อกิโลกรัมคงที่ ราคาต่อกิโลกรัมเป็นเท่าใด?`,`${items} kg of fruit costs ${items*price} THB at a fixed unit price. What is the price per kilogram?`],price,['บาท/กิโลกรัม','THB/kg'],['k = ราคารวม ÷ มวล','k = total cost ÷ mass.'],[`k = ${items*price}/${items} = ${price} บาท/กิโลกรัม`,`k = ${items*price}/${items} = ${price} THB/kg.`]),

function createQuiz(){state.quiz=generateQuiz();state.set='PL-'+Date.now().toString(36).toUpperCase();state.started=now()}
function newQuiz(){let attempted=state.quiz.some(q=>q.first||q.draft);if(attempted&&!confirm(T('สร้างชุดใหม่หรือไม่? ชุดปัจจุบันจะถูกเก็บในประวัติ (เก็บ 10 ชุดล่าสุด)','Generate a new set? This set will be archived (the latest 10 sets are kept).')))return;if(attempted){state.archives.unshift({student:{...state.student},set:state.set,started:state.started,quiz:JSON.parse(JSON.stringify(state.quiz)),missions:JSON.parse(JSON.stringify(state.missions)),time:now()});state.archives=state.archives.slice(0,10)}createQuiz();persist();renderQuiz()}
function editAnswer(i,value){let q=state.quiz[i];q.draft=value;q.last=null;persist();$('feedback'+i).innerHTML=`<span class="muted">${T('รอตรวจคำตอบใหม่','Awaiting a new check')}</span>`;updateScore()}
function isCorrect(q,value){return q.choices?value===q.answer:typeof value==='number'&&Math.abs(value-q.answer)<1e-9}
function checkQuestion(i,quiet=false){let q=state.quiz[i],value=q.choices?(q.choices.some(c=>c[0]===q.draft)?q.draft:null):parseNumber(q.draft);if(value===null){if(!quiet){$('feedback'+i).innerHTML=`<span class="bad">${T('กรุณาใส่คำตอบที่ถูกชนิดก่อนตรวจ','Enter a valid answer before checking.')}</span>`}return false}let result={value,correct:isCorrect(q,value),time:now(),hint:q.hintShown};if(!q.first)q.first={...result};q.last=result;q.attempts++;persist();return true}
function checkOne(i){if(checkQuestion(i)){renderQuiz();$('feedback'+i).scrollIntoView({block:'nearest'})}}
function checkAll(){let incomplete=0;state.quiz.forEach((q,i)=>{if(q.last)return;if(!checkQuestion(i,true))incomplete++});renderQuiz();if(incomplete)toast('มีบางข้อยังไม่ได้ตอบ ระบบตรวจเฉพาะข้อที่มีคำตอบ','Some answers are missing. Only valid answers were checked.')}
function showHint(i){state.quiz[i].hintShown=true;persist();$('hint'+i).innerHTML=`<div class="note">${esc(tr(state.quiz[i].hint))}</div>`;updateScore()}
function scores(quiz=state.quiz){return {first:quiz.filter(q=>q.first?.correct).length,firstCount:quiz.filter(q=>q.first).length,latest:quiz.filter(q=>q.last?.correct).length,reviewed:quiz.filter(q=>q.last).length,assisted:quiz.filter(q=>q.first?.hint).length}}
function scoreHTML(quiz){let n=scores(quiz);return `<div class="stats"><div class="stat"><span>${T('คะแนนคำตอบครั้งแรก','First-attempt score')}</span><b>${n.first} / 10</b><small>${T('ตรวจครั้งแรกแล้ว','First attempts checked')}: ${n.firstCount}/10 · ${T('เปิดคำใบ้ก่อนตอบครั้งแรก','Hint used before first check')}: ${n.assisted}</small></div><div class="stat"><span>${T('คะแนนคำตอบล่าสุดที่ตรวจแล้ว','Latest checked answers')}</span><b>${n.latest} / 10</b><small>${T('ตรวจคำตอบปัจจุบันแล้ว','Current answers checked')}: ${n.reviewed}/10</small></div></div>`}
function updateScore(){if($('quizScore'))$('quizScore').innerHTML=scoreHTML(state.quiz)}
function answerText(q,value){if(value===undefined||value===null||value==='')return T('ยังไม่ได้ตอบ','No answer');if(q.choices){let opt=q.choices.find(c=>c[0]===value);return opt?T(opt[1],opt[2]):String(value)}return String(value)}
function renderQuiz(){if(!state.quiz.length)createQuiz();$('content').innerHTML=`<section class="panel"><div class="labelrow"><h2>${T('แบบฝึกหัดสุ่ม 10 ข้อ','10-question practice')}</h2><button onclick="newQuiz()">${T('สุ่มชุดใหม่','Generate new set')}</button></div><p class="muted">${T('ชุด','Set')} ${esc(state.set)} · ${T('ตอบได้หลายครั้ง แต่คะแนนครั้งแรกจะไม่ถูกเขียนทับ เมื่อแก้คำตอบ สถานะล่าสุดจะกลับเป็นรอตรวจ','Retry as often as you need. First-attempt results are preserved. Editing an answer resets its latest checked status.')}</p><div id="quizScore">${scoreHTML(state.quiz)}</div></section><div class="quizList">${state.quiz.map((q,i)=>`<section class="panel question"><div class="eyebrow">${i+1} / 10 · ${esc(tr(q.topic))}</div><h3>${esc(tr(q.prompt))}</h3><div class="actions">${q.choices?`<select aria-label="${T('คำตอบข้อ','Answer to question')} ${i+1}" onchange="editAnswer(${i},this.value)"><option value="">${T('เลือกคำตอบ','Choose an answer')}</option>${q.choices.map(([v,th,en])=>`<option value="${v}" ${q.draft===v?'selected':''}>${T(th,en)}</option>`).join('')}</select>`:`<input class="answer" id="answer${i}" aria-label="${T('คำตอบข้อ','Answer to question')} ${i+1}" inputmode="decimal" value="${esc(q.draft)}" oninput="editAnswer(${i},this.value)" onkeydown="if(event.key==='Enter')checkOne(${i})"><span>${tr(q.unit)}</span>`}<button class="primary" onclick="checkOne(${i})">${T('ตรวจคำตอบ','Check answer')}</button><button onclick="showHint(${i})">${T('คำใบ้','Hint')}</button></div><div id="hint${i}">${q.hintShown?`<div class="note">${esc(tr(q.hint))}</div>`:''}</div><div id="feedback${i}" class="feedback" aria-live="polite">${q.last?`<div class="${q.last.correct?'good':'bad'}"><b>${q.last.correct?T('✓ ถูกต้อง','✓ Correct'):T('✕ ยังไม่ถูกต้อง','✕ Not correct yet')}</b><p>${T('เฉลย','Answer')}: ${esc(answerText(q,q.answer))} ${tr(q.unit)}</p><p>${esc(tr(q.reason))}</p></div>`:`<span class="muted">${T('รอตรวจคำตอบ','Awaiting a check')}</span>`}</div>${q.first?`<p class="small">${T('คำตอบครั้งแรก','First answer')}: ${esc(answerText(q,q.first.value))} · ${q.first.correct?T('ถูก','Correct'):T('ผิด','Incorrect')} · ${T('ตรวจแล้ว','Checks')}: ${q.attempts}</p>`:''}</section>`).join('')}</div><section class="panel"><div class="actions"><button class="primary" onclick="checkAll()">${T('ตรวจคำตอบที่ยังรอตรวจทั้งหมด','Check all pending answers')}</button><button onclick="go('report')">${T('ดูรายงานและส่งออก PDF','View report & export PDF')}</button></div></section>`;persist()}
function reportData(index=-1){return index<0?{student:state.student,set:state.set,started:state.started,quiz:state.quiz,missions:state.missions,time:now()}:state.archives[index]}
function reportBody(r){let n=scores(r.quiz);return `<div class="reportHead"><div>PROPORTION LAB · ${T('คณิตศาสตร์ ม.1','GRADE 7 MATHEMATICS')}</div><h2>${T('รายงานผลการเรียนรู้เรื่องสัดส่วน','Proportion learning report')}</h2><p>${T('ชื่อ–นามสกุล','Full name')}: ${esc(r.student.name||'—')}<br>${T('ชั้น/ห้อง','Class/room')}: ${esc(r.student.room||'—')} · ${T('เลขที่','Student no.')}: ${esc(r.student.no||'—')}<br>${T('ชุด','Set')}: ${esc(r.set)}<br>${T('สร้างรายงาน','Report generated')}: ${date(now())} (UTC+7)</p></div><h3>${T('สรุปคะแนนแบบฝึกหัด','Practice scores')}</h3><p><b>${T('ครั้งแรก','First attempt')}: ${n.first}/10</b> (${T('ตรวจแล้ว','checked')}: ${n.firstCount}/10; ${T('ใช้คำใบ้ก่อนตรวจครั้งแรก','hint before first check')}: ${n.assisted})<br><b>${T('คำตอบล่าสุด','Latest checked answers')}: ${n.latest}/10</b> (${T('ตรวจแล้ว','checked')}: ${n.reviewed}/10)</p><p>${T('ข้อที่ยังไม่ได้ตรวจหรือมีการแก้ไขหลังตรวจจะแสดงว่ารอตรวจ และยังไม่นับเป็นคำตอบถูกในคะแนนล่าสุด','Unanswered items and edits made after checking are marked pending and do not count as correct in the latest score.')}</p><h3>${T('ภารกิจทีละขั้น','Guided missions')}: ${r.missions.filter(s=>s.done).length}/6</h3>${r.missions.map((s,i)=>`<div class="printItem"><b>${i+1}. ${esc(tr(missionData[i].title))} — ${s.done?T('ผ่าน','Passed'):T('ยังไม่ผ่าน','Not yet passed')}</b><p>${T('คำทำนายครั้งแรก','First prediction')}: ${s.first?esc(s.first.value)+' '+esc(tr(missionData[i].unit))+' · '+(s.first.correct?T('ตรงกับผลทดลอง','Matches the result'):T('ต่างจากผลทดลอง','Differs from the result')):T('ยังไม่มี','Not recorded')}<br>${T('ผลทดลองที่บันทึก','Recorded observation')}: ${s.observed?esc(tr(missionData[i].observation)):T('ยังไม่มี','Not recorded')}<br>${T('เหตุผลที่เลือก','Selected reasoning')}: ${s.reason!==''?esc(tr(missionData[i].reason[+s.reason])):'—'}</p></div>`).join('')}<h3>${T('คำตอบแบบฝึกหัดรายข้อ','Question-by-question results')}</h3>${r.quiz.map((q,i)=>`<div class="printItem"><b>${i+1}. ${esc(tr(q.prompt))}</b><p>${T('ครั้งแรก','First answer')}: ${q.first?esc(answerText(q,q.first.value))+' — '+(q.first.correct?T('ถูก','Correct'):T('ผิด','Incorrect')):T('ยังไม่ได้ตรวจ','Not checked')}<br>${T('คำตอบปัจจุบัน','Current answer')}: ${esc(answerText(q,q.draft))} — <b>${q.last?(q.last.correct?T('ถูก ✓','Correct ✓'):T('ผิด ✕','Incorrect ✕')):T('รอตรวจ','Pending')}</b><br>${T('เฉลย','Correct answer')}: ${esc(answerText(q,q.answer))} ${esc(tr(q.unit))}<br>${esc(tr(q.reason))}</p></div>`).join('')}<p class="reportFoot">${T('รายงานจากกิจกรรมฝึกเรียนรู้ เปิดบทเรียนและคำใบ้ได้ คะแนนจัดเก็บในเครื่องและไม่ได้รับการยืนยันตัวตน ให้นักเรียนนำ PDF ส่งครูตามช่องทางที่กำหนด','This is a practice report with access to lessons and hints. Results are stored locally and identity is not verified. Submit the PDF to your teacher through the agreed channel.')}</p>`}
let reportIndex=-1;
function renderReport(){reportIndex=-1;$('content').innerHTML=`<section class="panel"><div class="labelrow"><h2>${T('รายงานของฉัน','My learning report')}</h2><button class="primary" onclick="exportPDF()">${T('บันทึกเป็น PDF / พิมพ์','Save as PDF / Print')}</button></div><p>${T('กรอกชื่อก่อนส่งออก ปุ่มนี้เปิดหน้าพิมพ์ ให้เลือก “บันทึกเป็น PDF” หรือ “Save as PDF” แล้วนำไฟล์ส่งครู','Enter your name before exporting. This button opens the print dialog. Select “Save as PDF”, then submit the saved file to your teacher.')}</p><div class="note">${T('รายงานแสดงคะแนนครั้งแรกแยกจากคำตอบล่าสุด รวมทั้งคำทำนายและผลการทำภารกิจ','The report separates first-attempt and latest scores and includes mission predictions and observations.')}</div><label>${T('เลือกชุดรายงาน','Select report set')}<select id="reportSet" onchange="selectReport(this.value)"><option value="-1">${T('ชุดปัจจุบัน','Current set')} · ${esc(state.set)}</option>${state.archives.map((r,i)=>`<option value="${i}">${esc(r.set)} · ${esc(r.student.name||T('ไม่ระบุชื่อ','Unnamed'))}</option>`).join('')}</select></label><details><summary>${T('ดูตัวอย่างรายงาน (มีเฉลย)','Preview report (includes answers)')}</summary><div id="reportPreview" class="reportPreview">${reportBody(reportData())}</div></details></section>`}
function selectReport(value){reportIndex=+value;$('reportPreview').innerHTML=reportBody(reportData(reportIndex))}
function exportPDF(){let r=reportData(reportIndex);if(!r.student.name.trim()){toast('กรุณากรอกชื่อ–นามสกุลก่อนส่งออก รายงานเก่าที่ไม่มีชื่อให้ใช้ชุดปัจจุบัน','Enter your full name before exporting. For an unnamed archived set, use the current set.');$('studentName').focus();return}stop();$('printReport').innerHTML=reportBody(r);document.title='Proportion_Lab_'+r.student.name.replace(/[\\/:*?"<>|]/g,'_')+'_'+r.set;window.print()}
window.addEventListener('afterprint',()=>{document.title=T('Proportion Lab • สัดส่วน ม.1','Proportion Lab • Grade 7')});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
if(!state.quiz.length)createQuiz();render();
</script></body></html>
